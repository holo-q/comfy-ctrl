[project]
name = "comfyui-mcp-uiapi"
version = "0.1.0"
description = "MCP server for controlling ComfyUI through the uiapi extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "rich>=10.0.0",
    "websockets",
    "requests",
    "aiohttp",
    "huggingface-hub",
    "gdown",
]

[project.scripts]
comfyui-mcp-uiapi = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: these modules live at repo root, not in a src/ directory
packages = ["."]
only-include = ["mcp_server.py", "comfy_client.py", "model_defs.py", "civitai.py", "model_urls.json"]
